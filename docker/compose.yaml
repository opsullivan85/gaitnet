# GaitNet containers. From the repository root:
#
#   docker/build_isaaclab.sh                          # once per Isaac Lab pin, slow
#   docker compose -f docker/compose.yaml build sim
#   docker compose -f docker/compose.yaml run --rm sim -m gaitnet_sim.scripts.walk
#
# See docker/README.md.
name: gaitnet

x-gpu: &gpu
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [gpu]

services:
  # Experiment tracking: runs, metrics and artifacts (checkpoints, env/agent cfgs, bundles).
  # UI on http://localhost:5000, and on the LAN at http://<host-ip>:5000 (no auth: home
  # network only). Other containers reach it as mlflow:5000. MLflow's host-header check has
  # to be told about every name/IP it is reached by; 192.168.* covers a typical home LAN.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --allowed-hosts=mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,192.168.*
    ports:
      - 5000:5000
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped

  sim:
    image: gaitnet/sim:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile.sim
    deploy: *gpu
    # shared memory for the controller pool and torch
    ipc: host
    depends_on:
      - mlflow
    environment:
      ACCEPT_EULA: "Y"
      PRIVACY_CONSENT: "Y"
      ISAACSIM_PATH: /workspace/isaaclab/_isaac_sim
      MLFLOW_TRACKING_URI: http://mlflow:5000
    working_dir: /workspace/gaitnet
    # debugpy, for VS Code remote-attach (docker/README.md); `run` needs --service-ports
    # to actually publish it
    ports:
      - 127.0.0.1:5678:5678
    volumes:
      # the checkout, live: the gaitnet packages are installed editable from here
      - type: bind
        source: ..
        target: /workspace/gaitnet
      # Kit, shader and asset caches, so later runs start faster
      - kit-cache:/isaac-sim/kit/cache
      - kit-data:/isaac-sim/kit/data
      - ov-cache:/root/.cache/ov
      - gl-cache:/root/.cache/nvidia/GLCache
      - compute-cache:/root/.nv/ComputeCache
      - warp-cache:/root/.cache/warp
      - ov-logs:/root/.nvidia-omniverse/logs
      - ov-data:/root/.local/share/ov/data

  # The deployed planner (no ROS, no Isaac): runs a bundle from data/bundles against a
  # robot's rosbridge server. Profile "ros", so plain `up` leaves it alone.
  deploy:
    image: gaitnet/deploy:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile.deploy
    profiles: [ros]
    # debugpy, for VS Code remote-attach (docker/README.md); `run` needs --service-ports
    ports:
      - 127.0.0.1:5678:5678
    volumes:
      # the checkout, live: gaitnet-core/gaitnet-ros1 are installed editable from here
      - type: bind
        source: ..
        target: /workspace/gaitnet
      - type: bind
        source: ../data/bundles
        target: /bundles
        read_only: true

  # A stand-in for the robot: ROS Noetic, rosbridge and gaitnet_msgs, with a fake robot to run
  # against the planner (docker/ros_roundtrip.sh).
  ros:
    image: gaitnet/ros:noetic
    build:
      context: ..
      dockerfile: docker/Dockerfile.ros
    profiles: [ros]

volumes:
  mlflow-data:
  kit-cache:
  kit-data:
  ov-cache:
  gl-cache:
  compute-cache:
  warp-cache:
  ov-logs:
  ov-data:
